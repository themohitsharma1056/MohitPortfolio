    </filter>
  </defs>
  <circle cx="128" cy="128" r="108" fill="#0b0b0b" stroke="#00e5ff" stroke-width="8" filter="url(#glow)"/>
  <text x="128" y="165" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="120" font-weight="700"
        fill="white">M</text>
