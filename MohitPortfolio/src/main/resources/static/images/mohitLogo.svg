<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>

    <!-- Logo Mark Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#90E0EF" />
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
  </defs>

  <!-- Background Dark Card -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)" />

  <!-- Logo Icon (Abstract M + Orbit) -->
  <g transform="translate(0, -10)">
    <!-- The Left Pillar of M -->
    <path d="M 180,260 L 180,160 C 180,140 195,130 210,145 L 250,190 L 290,145 C 305,130 320,140 320,160 L 320,260" 
          fill="none" 
          stroke="url(#logoGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Dynamic Swoosh / Orbit -->
    <path d="M 140,230 C 140,230 200,280 250,280 C 310,280 370,210 350,160" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="12" 
          stroke-linecap="round" 
          opacity="0.85" />
          
    <!-- Decorative Tech Dot -->
    <circle cx="350" cy="160" r="8" fill="#00B4D8" />
  </g>

  <!-- Typography (Centered without tagline) -->
  <g id="brand-name">
    <text x="250" y="400" 
          text-anchor="middle" 
          font-family="'Montserrat', 'Helvetica Neue', sans-serif" 
          font-size="46" 
          font-weight="900" 
          letter-spacing="6" 
          fill="url(#textGrad)">MOHIT</text>
  </g>
</svg>
