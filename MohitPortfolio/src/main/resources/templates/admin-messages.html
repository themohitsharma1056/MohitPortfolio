<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Panel</title>
	<link rel="icon"
      type="image/svg+xml"
      href="/images/mohitLogo.svg">
      
      <meta name="description"
      content="Administrator dashboard for managing Mohit Portfolio messages and content.">
       <meta name="author"
       content="Mohit Sharma">
       <meta name="robots"
       content="noindex, nofollow">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}">
    </div>

    <section class="admin-wrapper">

        <div class="admin-panel">

            <div class="admin-top">

                <h1 class="contact-msg">
                    Contact Messages
                </h1>
                
                <a th:href="@{/logout}"

                  class="logout-btn">
               Logout
               </a>

            </div>
            <form
      th:action="@{/admin/messages}"
      method="get"

      class="search-form">

    <input
           type="text"

           name="keyword"

           th:value="${keyword}"

           placeholder="Search by name, email or message..."

           class="search-input">

    <button
            type="submit"

            class="search-btn">

        Search

    </button>
    
    <a th:href="@{/admin/messages}"
   class="clear-btn">

    Clear

</a>

</form>
<div class="stats-grid">

    <div class="stat-card">

        <span class="stat-label">
            Total Messages
        </span>

        <h2 th:text="${totalMessages}">
            0
        </h2>

    </div>

    <div class="stat-card">

        <span class="stat-label">
            Unread Messages
        </span>

        <h2 th:text="${unreadMessages}">
            0
        </h2>

    </div>

    <div class="stat-card">

        <span class="stat-label">
            Read Messages
        </span>

        <h2 th:text="${readMessages}">
            0
        </h2>

    </div>

</div>
            <div class="table-responsive custom-scroll">
            

                <table class="admin-table">

                    <thead>

                        <tr>

                            <th class="name-column">
                                Name
                            </th>

                            <th class="email-column">
                                Email
                            </th>

                            <th class="message-column">
                                Message
                            </th>

                            <th class="date-column">
                                Received
                            </th>

                            <th class="status-column">
                                Status
                            </th>

                            <th class="action-column">
                                Action
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="message : ${messages}">

                            <td class="name-column"
                                th:text="${message.name}">
                            </td>

                            <td class="email-column"
                                th:text="${message.email}">
                            </td>

                            <td class="message-column">

                                <div class="message-text"
                                     th:text="${message.message}">
                                </div>

                            </td>


                            <td class="date-column">

                                <span class="date-text"
                                      th:text="${#temporals.format(
                                      message.createdAt,
                                      'dd MMM yyyy')}">
                                </span>

                                <span class="time-text"
                                      th:text="${#temporals.format(
                                      message.createdAt,
                                      'hh:mm a')}">
                                </span>

                            </td>

                            <td class="status-column">

                                <div class="status-wrapper">


                                    <span
                                        th:if="${message.read}"
                                        class="status-badge read-badge">

                                        Read

                                    </span>

                                    <span
                                        th:unless="${message.read}"
                                        class="status-badge unread-badge">

                                        Unread

                                    </span>


                                    <a
                                       th:if="${!message.read}"

                                       th:href="@{/admin/read/{id}(id=${message.id})}"

                                       class="mark-read-btn">

                                        Mark Read

                                    </a>

                                </div>

                            </td>


                            <td class="action-column">

                               <a
                               th:href="@{/admin/delete/{id}(id=${message.id})}"

                               class="delete-btn"

                              onclick="return confirm(
                               'Are you sure you want to delete this message?')">

                               Delete
       
                             </a>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </section>


    <script
        th:src="@{/js/script.js}">
    </script>

</body>

</html>
