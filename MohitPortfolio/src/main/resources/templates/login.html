<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>
    	<link rel="icon"
      type="image/svg+xml"
      href="/images/mohitLogo.svg">
    <meta name="description"
    content="Secure administrator login for Mohit Portfolio management dashboard.">
    <meta name="author"
    content="Mohit Sharma">
    <meta name="robots"
    content="noindex, nofollow">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body class="login-page">

    <div class="login-card">

        <h1 class="login-title">
            Admin Login
        </h1>


        <div
            th:if="${param.error}"

            class="login-error">

            Invalid username or password

        </div>


        <form
            th:action="@{/login}"

            method="post">


            <input
                type="text"

                name="username"

                placeholder="Username"

                class="login-input">


            <input
                type="password"

                name="password"

                placeholder="Password"

                class="login-input">


            <button
                type="submit"

                class="login-btn">

                Access Admin Panel

            </button>

        </form>

    </div>

</body>
</html>
